# Read by bar/check.py in Proven-Commons/mission.
# See playbook/verified-bar.md there for what each field means.

[project]
name = "png"
# "in-progress" until every bar item passes, then "verified".
status = "in-progress"
page = "README.md"
# GitHub handles of everyone who wrote the specification.
spec_authors = ["abu-aska"]
# The program people run. A change to it voids the approval.
entry_points = ["Main.lean"]

[spec]
files = ["SPEC.md", "Spec.lean"]
# The code under proof: the functions the statements are about.
code = [
  # The data types the statements are about.
  "Png.Chunk", "Png.Doc", "Png.Ihdr",
  # The byte forms and the printer.
  "Png.signature", "Png.Chunk.typeBytes", "Png.isLetter",
  "Png.ihdrType", "Png.iendType", "Png.iendChunk", "Png.isIEND",
  "Png.be32", "Png.u32", "Png.chunkCrc", "Png.printChunk",
  "Png.print",
  # The CRC-32 the chunk checks use.
  "Png.Crc32.step", "Png.Crc32.step8", "Png.Crc32.table",
  "Png.Crc32.update", "Png.Crc32.crc32",
  # Well formedness at the chunk layer.
  "Png.WFChunk", "Png.WF",
  # The chunk readers and the parser.
  "Png.get4", "Png.parseChunk", "Png.parseChunks", "Png.parse",
  # The IHDR header: the allowed table, the check, well
  # formedness, the printer, the reader, and the file level read.
  "Png.allowedDepths", "Png.pairAllowed", "Png.allowedPairs",
  "Png.checkPair", "Png.WFHeader", "Png.printIhdr",
  "Png.parseIhdr", "Png.headerOf", "Png.parseFile", "Png.WFFull",
]

# One entry per approval, added in a pull request the reviewer approves.
# [[spec.approval]]
# reviewer = "github-handle"
# date = "2026-11-02"
# sha256 = "..."
# record = "https://github.com/Proven-Commons/png/pull/<n>"

[tests]
results = "tests/TEST-RESULTS.md"
command = "python3 tests/run_tests.py"
files = ["tests/run_tests.py"]
